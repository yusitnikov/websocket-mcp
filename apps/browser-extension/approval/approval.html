<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Approval</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: system-ui, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: #242424;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 40px;
            width: 520px;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 16px;
            color: #888;
            line-height: 1.5;
            margin-bottom: 32px;
        }

        .session-code {
            font-family: monospace;
            font-size: 34px;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: #fff;
            background: #111;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 18px 28px;
            margin-bottom: 20px;
            display: inline-block;
        }

        .scope-section {
            margin-bottom: 28px;
        }

        .scope-label {
            font-size: 13px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 10px;
        }

        .scope-all {
            font-family: monospace;
            font-size: 15px;
            color: #fcd34d;
            background: #3a2a00;
            border: 1px solid #7a5800;
            border-radius: 5px;
            padding: 4px 12px;
            display: inline-block;
        }

        .hostname-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .hostname-tag {
            font-family: monospace;
            font-size: 15px;
            color: #ddd6fe;
            background: #3b2f6e;
            border: 1px solid #6d5bbf;
            border-radius: 5px;
            padding: 4px 12px;
        }

        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        button {
            padding: 14px 32px;
            border-radius: 8px;
            border: none;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s;
        }

        button:hover {
            opacity: 0.85;
        }

        button:disabled {
            opacity: 0.4;
            cursor: default;
        }

        .btn-approve {
            background: #2563eb;
            color: #fff;
        }

        .btn-reject {
            background: #333;
            color: #e0e0e0;
            border: 1px solid #555;
        }

        .warning-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .status {
            font-size: 15px;
            color: #666;
            margin-top: 24px;
            font-style: italic;
            line-height: 1.5;
        }

        .status.warning {
            color: #d97706;
            font-style: normal;
            font-weight: 500;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="warning-icon hidden" id="warning-icon">⚠️</div>
        <h1>Automation Session Request</h1>
        <p class="subtitle" id="subtitle">An automation session is requesting access to your browser.<br>Confirm the session code matches what you were shown.</p>
        <div class="session-code hidden" id="session-code">—</div>
        <div class="scope-section hidden" id="scope-section">
            <p class="scope-label">Requesting access to</p>
            <p class="scope-all hidden" id="scope-all">ALL TABS</p>
            <div class="hostname-list hidden" id="hostname-list"></div>
        </div>
        <div class="actions hidden" id="actions">
            <button class="btn-approve" id="btn-approve" disabled>Approve</button>
            <button class="btn-reject" id="btn-reject" disabled>Reject</button>
        </div>
        <p class="status" id="status">Loading…</p>
    </div>
    <script type="module" src="./approval.ts"></script>
</body>
</html>
